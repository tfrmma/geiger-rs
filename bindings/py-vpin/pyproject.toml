[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "py-vpin"
version = "0.1.0"
description = "Streaming VPIN (BVC on a volume clock) for gamma-scalper and friends, Rust core via pyo3"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# Cargo.toml's [lib] name is "vpin", that's the actual import name
# (`import vpin`), independent of this package's distribution name
# (`pip install py-vpin`).
module-name = "vpin"
features = ["extension-module"]
