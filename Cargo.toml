[workspace]
resolver = "2"
members = [
    "crates/backoff",
    "crates/vpin-engine",
    "crates/trade-ingest",
    "crates/toxicity-client-rs",
    "services/toxicity-service",
    "bindings/py-vpin",
    "tools/calibrate",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
rust-version = "1.85"

[workspace.dependencies]
thiserror          = "2"
libm               = "0.2"
pyo3               = "0.29"
tokio              = { version = "1", features = ["full"] }
tokio-tungstenite  = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls             = { version = "0.23", default-features = false, features = ["ring"] }
futures-util       = { version = "0.3", features = ["sink"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

feedhandler        = { git = "https://github.com/tfrmma/feedhandler-core-rs" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug    = true
